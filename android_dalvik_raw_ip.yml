title: Dalvik HTTP Client Talking Directly to a Raw IP
id: 2b8e4c1f-6a07-4d93-b5e2-9f1c7a0d84e6
status: experimental
description: >
    An Android app (Dalvik user-agent) making HTTP requests straight to an IPv4
    host instead of a domain name. Benign apps almost always use domains and a
    CDN; a raw-IP beacon from a Dalvik client is a common background-C2 tell.
author: leoaida
date: 2026/11/10
logsource:
    category: proxy
detection:
    client:
        c-useragent|startswith: 'Dalvik/'
    rawip:
        cs-host|re: '^\d{1,3}(\.\d{1,3}){3}$'
    condition: client and rawip
falsepositives:
    - CDN or ad SDKs that occasionally connect by IP
level: medium
tags:
    - attack.command_and_control
