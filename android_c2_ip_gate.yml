title: Android C2 IP-Based PHP Gateway Callback
id: 7d3f1a2e-9c4b-4e71-a8d2-5f6c0b1e3a94
status: experimental
description: >
    Detects HTTP requests to a hard-coded IPv4 address with a PHP gateway path
    (e.g. http://45.136.12.34/gate.php). This is a long-running pattern in
    Android SMS bots and bankers, which beacon to a numeric host instead of a
    domain to dodge DNS-based blocking.
references:
    - https://attack.mitre.org/techniques/T1071/001/
author: leoaida
date: 2026/11/10
logsource:
    category: proxy
detection:
    selection:
        c-uri|re: 'https?://\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?/[A-Za-z0-9_]{1,16}\.php'
    condition: selection
falsepositives:
    - Legacy internal apps that call PHP endpoints directly by IP
    - Some ad / analytics SDKs
level: high
tags:
    - attack.command_and_control
    - attack.t1071.001
